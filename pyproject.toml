[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cms-hospital-quality-cost-benchmarking"
version = "0.1.0"
description = "Reproducible CMS hospital quality and cost benchmarking pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Krishna Sanjay"}]
dependencies = [
  "duckdb>=1.1,<2",
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "pydantic-settings>=2.5,<3",
  "tenacity>=9,<10",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.7,<1"]

[project.scripts]
cms-hospital = "cms_hospital_benchmark.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=cms_hospital_benchmark --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

